services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en el archivo .env}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - mi-patrimonio-db:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sólo visible dentro de la red de Docker: no se publica en la red doméstica.
    networks:
      - mi-patrimonio

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/app_db
      TZ: ${TZ:-Europe/Madrid}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - mi-patrimonio

volumes:
  mi-patrimonio-db:
    name: mi-patrimonio-db

networks:
  mi-patrimonio:
    driver: bridge
